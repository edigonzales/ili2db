// Release only the pg and gpkg variants. Resolve the source artifact from the
// same snapshot module and verify its source commit against the runtime JAR.
configurations { ibxSources { transitive = false } }
dependencies { ibxSources 'ch.interlis:iox-ibx:0.2.0-SNAPSHOT:sources' }
def releaseMetadata = layout.buildDirectory.file('ibx-release/provenance.json')
tasks.register('ibxProvenance') {
    outputs.file(releaseMetadata)
    outputs.upToDateWhen { false }
    doLast {
        def binary = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'ch.interlis' && it.name == 'iox-ibx'
        }
        def source = configurations.ibxSources.singleFile
        def commitOf = { File f ->
            new java.util.jar.JarFile(f).withCloseable { it.manifest.mainAttributes.getValue('Source-Commit') }
        }
        def binaryCommit = commitOf(binary.file)
        if (!binaryCommit || binaryCommit != commitOf(source)) {
            throw new GradleException('iox-ibx binary/source snapshot mismatch; refresh dependencies and retry')
        }
        def sha256 = { File f ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            f.withInputStream { input ->
                byte[] buffer = new byte[65536]
                int n
                while ((n = input.read(buffer)) != -1) digest.update(buffer, 0, n)
            }
            digest.digest().encodeHex().toString()
        }
        def data = [ili2dbCommit: getGitHash(), releaseVersion: project.version.toString(),
            ioxIbx: [coordinate: binary.moduleVersion.id.toString(), sourceCommit: binaryCommit,
                binary: binary.file.name, binarySha256: sha256(binary.file),
                sources: source.name, sourcesSha256: sha256(source)]]
        def output = releaseMetadata.get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data)) + '\n'
    }
}
tasks.register('ibxSourceDist', Zip) {
    dependsOn 'ibxProvenance'
    archiveBaseName = 'ili2db-ibx'
    archiveClassifier = 'sources'
    destinationDirectory = file('dist')
    from('.') {
        include 'build.gradle', 'settings.gradle', 'gradlew', 'gradlew.bat', 'gradle/**'
        include 'src/**', 'gui/**', 'gui-noop/**', 'ili2pg/**', 'ili2gpkg/**', 'test/**'
        include 'ili2mysql/**', 'ili2h2gis/**', 'ili2duckdb/**', 'ili2fgdb/**', 'ili2mssql/**', 'ili2ora/**', 'libs/**'
        include 'resources/**', 'docs/**', 'README.rst', '.github/**', 'scripts/**'
        exclude '**/*.log', '**/*-out.*', '**/*.gpkg', '**/*.class', '**/.DS_Store'
    }
    into('dependencies/iox-ibx') { from { zipTree(configurations.ibxSources.singleFile) } }
    into('dependencies') { from configurations.ibxSources }
    from releaseMetadata
}
tasks.register('ibxReleaseChecksums') {
    dependsOn 'ili2pgBindist', 'ili2gpkgBindist', 'ibxSourceDist'
    doLast {
        def artifacts = [ili2pgBindist.archiveFile.get().asFile, ili2gpkgBindist.archiveFile.get().asFile,
            tasks.named('ibxSourceDist').get().archiveFile.get().asFile]
        file('dist/SHA256SUMS').text = artifacts.collect { f ->
            java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString() + '  ' + f.name
        }.join('\n') + '\n'
        copy { from releaseMetadata; into 'dist' }
    }
}
