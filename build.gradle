task usrdoc(type:Exec) {
	group = JavaBasePlugin.DOCUMENTATION_GROUP
    description = 'Builds the user documentation (html)'
	def infile=new File(project.projectDir,'docs/ili2db.rst')
	def outfile=new File(project.buildDir,'docs/ili2db.html')
	inputs.file infile
	outputs.file outfile
	doFirst{
		new File(project.buildDir,'docs').mkdir()
	}
		workingDir = project.buildDir
		executable rst2html
		args = [infile, outfile]
}
task ili2pgJar(dependsOn: jar,type: Jar) {
	archiveBaseName = 'ili2pg'
    from sourceSets.ili2pg.output
  manifest {
    attributes(
      "Main-Class": "ch.ehi.ili2pg.PgMain",
      "Class-Path": 'libs/'+jar.archiveFileName.get()+' '+configurations.ili2pgRuntimeClasspath.collect { 'libs/'+it.getName() }.join(' '))
  }   
}
task ili2pgBindist(dependsOn:[usrdoc,ili2pgJar], type: Zip){
	archiveBaseName = 'ili2pg'
	destinationDirectory = file('dist')
	from ili2pgJar
	into('docs'){
		from files(fileTree("docs").include("LICENSE.*"),"docs/README.txt","docs/CHANGELOG.txt","build/docs/ili2db.html","docs/IBX.md")
	}
	into('libs'){
		from configurations.ili2pgRuntimeClasspath
		from jar
		//def jars=[]
		//subprojects.each {
        //	jars+=it.libsDir
        //}
        //from jars
	}
	// version = '1.0.6'
}
task ili2pgTest(type: Test) {
	maxParallelForks = 1
	forkEvery = 1
	
    classpath = sourceSets.ili2pgTest.runtimeClasspath
    
	// testClassesDirs The directories for the compiled test sources
	// Default with java plugin: project.sourceSets.test.output.classesDirs
    testClassesDirs = sourceSets.ili2pgTest.output.classesDirs
	if(dburl!=null) systemProperty 'dburl', dburl
	if(dbusr!=null) systemProperty 'dbusr', dbusr
	if(dbpwd!=null) systemProperty 'dbpwd', dbpwd
    testLogging.exceptionFormat = 'full'
}
